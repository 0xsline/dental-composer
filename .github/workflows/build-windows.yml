name: build

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Configure and build
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mac --config Release -j3

      - name: Selftest (offscreen)
        run: |
          export QT_QPA_PLATFORM=offscreen
          mkdir -p "$RUNNER_TEMP/dc"
          ./build-mac/dental-composer.app/Contents/MacOS/dental-composer --selftest "$RUNNER_TEMP/dc/selftest.png"

      - name: Package dmg
        run: |
          macdeployqt build-mac/dental-composer.app -verbose=1
          hdiutil create -volname "牙片拼图" -srcfolder build-mac/dental-composer.app \
            -ov -format UDZO DentalComposer-0.1.5-mac.dmg
          ls -lh DentalComposer-0.1.5-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dental-composer-macos
          path: DentalComposer-0.1.5-mac.dmg

  build-win7-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install MSVC v142 (VS2019) toolset
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --norestart

      - name: Install Qt 5.15.2 (MSVC2019 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Configure (VS2022 + v142 toolset, Win7-compatible ABI)
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DCMAKE_GENERATOR_TOOLSET=v142

      - name: Build Release
        run: cmake --build build-win --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release --no-translations build-win/Release/dental-composer.exe
          # Qt 5.15 的 PNG 支持内置于 Qt5Gui（无 qpng 插件）；JPEG/GIF 等插件已由 windeployqt 拷贝
          # windeployqt 找不到 VCINSTALLDIR 会漏拷运行库，这里显式补上。
          # 必须锁定 x64 的 VC142 (14.29) 运行库：ARM64X/ARM64EC 版本在 Win7 上
          # 会报"无法定位程序输入点 RtlIsEcCode"（Get-ChildItem 字母序会把 arm64 排在 x64 前面）
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Directory |
                 Where-Object { $_.Name -eq 'Microsoft.VC142.CRT' -and $_.FullName -match '\\x64\\Microsoft\.VC142\.CRT$' } |
                 Select-Object -First 1
          if (-not $crt) { throw "VC142 x64 CRT not found" }
          Copy-Item -Force "$($crt.FullName)\*.dll" build-win\Release\
          $v1 = (Get-Item build-win\Release\vcruntime140_1.dll).VersionInfo.FileVersion
          Write-Host "vcruntime140_1.dll version: $v1"
          if ($v1 -notlike '14.29*') { throw "vcruntime140_1.dll wrong version: $v1" }
          # Win7 默认不带 UCRT，随包分发。必须用 Win10 SDK 19041 的 UCRT
          # （Win11 SDK 26100 的 ucrt 引用了 Win7 内核没有的函数，会报"无法定位程序输入点"）
          $ucrt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Directory |
                  Where-Object { $_.FullName -match '10\.0\.19041[^\\]*\\ucrt\\DLLs\\x64$' } | Select-Object -First 1
          if (-not $ucrt) {
            $ucrt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Directory |
                    Where-Object { $_.FullName -match '10\.0\.1\d{4}[^\\]*\\ucrt\\DLLs\\x64$' } | Select-Object -First 1
          }
          if (-not $ucrt) { throw "No Win10 SDK ucrt redist found" }
          Copy-Item -Force "$($ucrt.FullName)\*.dll" build-win\Release\
          $ucrtVer = (Get-Item build-win\Release\ucrtbase.dll).VersionInfo.FileVersion
          Write-Host "ucrtbase.dll version: $ucrtVer"
          if ($ucrtVer -notlike "10.0.19041*") { throw "ucrtbase.dll not 19041: $ucrtVer" }
          if (-not (Test-Path build-win\Release\vcruntime140.dll)) { throw "vcruntime140.dll missing" }
          # 离屏自测需要 qoffscreen（windeployqt 默认只拷 qwindows）
          $offscreen = Join-Path $env:QT_ROOT_DIR "plugins\platforms\qoffscreen.dll"
          if (-not (Test-Path $offscreen)) { throw "qoffscreen.dll not in Qt: $offscreen" }
          Copy-Item -Force $offscreen build-win\Release\platforms\

      - name: Prepare signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) { "HAS_CERT=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii }

      - name: Sign binaries (runs only when certificate secrets exist)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 build-win/Release/dental-composer.exe

      - name: Selftest (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $outDir = Join-Path $env:RUNNER_TEMP "dc"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exe = "build-win\Release\dental-composer.exe"
          $png = Join-Path $outDir "selftest.png"
          $p = Start-Process -FilePath $exe -ArgumentList @("--selftest", $png) -Wait -PassThru -NoNewWindow
          Write-Host "selftest exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - name: Build NSIS installer
        working-directory: scripts
        run: makensis /DAPP_DIR=..\build-win\Release installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: dental-composer-win7-x64
          path: |
            build-win/Release/**
            scripts/DentalComposer-0.1.5-Win7-x64-setup.exe
