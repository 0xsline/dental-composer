name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build-win7-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install MSVC v142 (VS2019) toolset
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --norestart

      - name: Install Qt 5.15.2 (MSVC2019 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Configure (VS2022 + v142 toolset, Win7-compatible ABI)
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DCMAKE_GENERATOR_TOOLSET=v142

      - name: Build Release
        run: cmake --build build-win --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release --no-translations build-win/Release/dental-composer.exe
          # Qt 5.15 的 PNG 支持内置于 Qt5Gui（无 qpng 插件）；JPEG/GIF 等插件已由 windeployqt 拷贝
          # windeployqt 找不到 VCINSTALLDIR 会漏拷运行库，这里显式补上（v142 对应 VC142.CRT）
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC142.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item -Force "$($crt.FullName)\*.dll" build-win\Release\ }
          # Win7 默认不带 UCRT（需 KB2999226 补丁），随包分发 ucrtbase.dll 等，保证裸机可跑
          $ucrt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Directory |
                  Where-Object { $_.FullName -match 'ucrt\\DLLs\\x64$' } | Select-Object -First 1
          if ($ucrt) { Copy-Item -Force "$($ucrt.FullName)\*.dll" build-win\Release\ }
          # 完整性断言
          if (-not (Test-Path build-win\Release\vcruntime140.dll)) { throw "vcruntime140.dll missing" }
          if (-not (Test-Path build-win\Release\ucrtbase.dll)) { throw "ucrtbase.dll missing" }

      - name: Prepare signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
        run: |
          if ($env:CERT_BASE64) { "HAS_CERT=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii }

      - name: Sign binaries (runs only when certificate secrets exist)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 `
              /tr http://timestamp.digicert.com /td sha256 build-win/Release/dental-composer.exe

      - name: Build NSIS installer
        working-directory: scripts
        run: makensis /DAPP_DIR=..\build-win\Release installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: dental-composer-win7-x64
          path: |
            build-win/Release/**
            scripts/DentalComposer-0.1.0-Win7-x64-setup.exe
